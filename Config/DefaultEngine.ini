; =============================================================================
; SHADOWBOUND: THE LAST NIGHT - Unreal Engine 5 configuration (Android first)
;
; Replaces the Unity ProjectSettings/ folder that used to live in this
; repository. Everything here is hand-authored text, reviewable in a diff,
; for the same reason the project previously committed no binary scenes.
; =============================================================================

; -----------------------------------------------------------------------------
; Boot: the whole game is assembled at runtime by AShadowboundGameMode
; (arena, player, enemies, HUD) - mirroring the old GameBootstrap approach -
; so the default map is an empty engine map and no .umap is authored.
; -----------------------------------------------------------------------------
[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/Shadowbound.ShadowboundGameMode
GameInstanceClass=/Script/Shadowbound.ShadowboundGameInstance

; -----------------------------------------------------------------------------
; Android player. Section is config=Engine, so it belongs in DefaultEngine.ini.
; Targets match the previous Unity Android configuration: landscape, min API 24,
; ARM64 only, Vulkan.
; -----------------------------------------------------------------------------
[/Script/AndroidRuntimeSettings.AndroidRuntimeSettings]
PackageName=com.shadowbound.thelastnight
ApplicationDisplayName=Shadowbound
Orientation=Landscape
MinSDKVersion=24
TargetSDKVersion=0
bSupportsVulkan=True
bBuildForArm64=True
bBuildForX86=False
MaxAspectRatio=2.4
