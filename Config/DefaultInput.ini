; =============================================================================
; SHADOWBOUND: THE LAST NIGHT - input configuration (config=Input)
;
; Enhanced Input is the input stack. The mapping context and every action are
; built in C++ (AShadowboundPlayerController), so no Input Action assets are
; committed to the repository.
; =============================================================================

[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.InputComponent
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
DefaultViewportMouseLockMode=LockOnCapture
bCaptureMouseOnLaunch=True
