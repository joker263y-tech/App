name: Shadowbound — Unreal Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'Unreal/**'
      - '.github/workflows/unreal-android.yml'
      - '!Unreal/Saved/**'
      - '!Unreal/DerivedDataCache/**'

permissions:
  contents: read

# IMPORTANT:
# GitHub-hosted standard runners do not contain Unreal Engine and only provide
# 14 GB of SSD on the current standard Linux image. UE5 Android packaging
# therefore runs on a self-hosted runner that already has UE 5.8.x + Android SDK/NDK.
# This removes Unity licensing from the pipeline but does NOT magically install
# a 50+ GB Unreal environment on a standard GitHub-hosted runner.

jobs:
  package-android:
    name: Package Android (UE 5.8.x)
    runs-on: [self-hosted, Linux, x64, ue5, android]
    env:
      UE_ROOT: ${{ vars.UE_ROOT }}
      PROJECT: ${{ github.workspace }}/Unreal/Shadowbound.uproject
      OUTPUT: ${{ github.workspace }}/artifacts/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Unreal + Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -n "${UE_ROOT:-}" || { echo "UE_ROOT repository variable is missing"; exit 1; }
          test -x "$UE_ROOT/Engine/Build/BatchFiles/RunUAT.sh" || {
            echo "RunUAT.sh was not found at $UE_ROOT"; exit 1;
          }
          mkdir -p "$OUTPUT"
          echo "Using Unreal Engine at: $UE_ROOT"
          echo "Project: $PROJECT"

      - name: Package Android Development / ASTC
        shell: bash
        run: |
          set -euo pipefail
          "$UE_ROOT/Engine/Build/BatchFiles/RunUAT.sh" BuildCookRun \
            -project="$PROJECT" \
            -noP4 \
            -utf8output \
            -unattended \
            -platform=Android \
            -targetplatform=Android \
            -cookflavor=ASTC \
            -clientconfig=Development \
            -build \
            -cook \
            -stage \
            -pak \
            -iostore \
            -compressed \
            -package \
            -archive \
            -archivedirectory="$OUTPUT"

      - name: List generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          find "$OUTPUT" -type f -maxdepth 8 -print | sort
          test -n "$(find "$OUTPUT" -type f \( -name '*.apk' -o -name '*.aab' \) -print -quit)" || {
            echo "No APK/AAB was generated."; exit 1;
          }

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadowbound-android-${{ github.sha }}
          path: artifacts/android/**/*
          if-no-files-found: error
          retention-days: 7
