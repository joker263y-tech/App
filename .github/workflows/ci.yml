# =============================================================================
# SHADOWBOUND: THE LAST NIGHT - continuous integration
# =============================================================================
#
# Two very different jobs, deliberately:
#
#   verify   - the three verification gates. No Unity anywhere, runs in about a
#              minute, on every push and pull request. This is the same code
#              path documented in Documentation/Verification.md.
#
#   android  - builds the real APK with Unity inside game-ci's container. This
#              costs a Unity license and 15-40 minutes per run, so it only runs
#              on pushes to main (and manual dispatch), and only once license
#              secrets are configured - it SKIPS rather than fails until then.
#
# Required repository secrets for the android job (see Documentation/Building.md):
#
#   Personal licence:      UNITY_LICENSE (the .ulf licence file contents),
#                          UNITY_EMAIL, UNITY_PASSWORD
#   Professional licence:  UNITY_SERIAL, UNITY_EMAIL, UNITY_PASSWORD
#
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Verify (core tests, syntax, Unity layer)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Core purity gate (core must stay engine-free)
        run: bash Tools/check-core-purity.sh

      - name: Core build + test suite
        run: bash Tools/test-core.sh

      - name: Syntax gate (every file parses at C# 9)
        run: bash Tools/check-syntax.sh

      - name: Unity layer type-check (real Unity reference assemblies)
        run: bash Tools/check-unity-layer.sh

  license-check:
    name: Check for Unity licence secrets
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}

    steps:
      - name: Check secrets
        id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [ -n "$UNITY_LICENSE" ] || [ -n "$UNITY_SERIAL" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Unity licence secrets configured - skipping the APK build. See Documentation/Building.md."
          fi

  android:
    name: Build Android APK (Unity)
    runs-on: ubuntu-latest
    needs: [verify, license-check]

    # Only on pushes to main and manual runs - an APK per pull request is not
    # worth 30 minutes of runner time.
    if: >-
      needs.license-check.outputs.available == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache the Unity Library folder
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Shadowbound-Android-${{ hashFiles('Packages/manifest.json') }}
          restore-keys: |
            Library-Shadowbound-Android-
            Library-Shadowbound-

      - name: Build the APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          targetPlatform: Android
          unityVersion: auto
          androidExportType: androidPackage
          # Our own entry point: creates the scene, configures the Android
          # player, validates the content (throwing on errors) and builds to
          # build/Android/Shadowbound.apk where the artifact step finds it.
          buildMethod: Shadowbound.Editor.ProjectSetup.BuildAndroidFromCommandLine

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: Shadowbound-APK
          path: build/Android/*.apk
          if-no-files-found: error
