name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Verify (core tests, syntax, Unity layer)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Core purity
        run: bash Tools/check-core-purity.sh

      - name: Core tests
        run: bash Tools/test-core.sh

      - name: Syntax gate
        run: bash Tools/check-syntax.sh

      - name: Unity layer type-check
        run: bash Tools/check-unity-layer.sh

  unity-activation:
    name: Unity Personal Activation
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'

    steps:
      - name: Generate Unity activation request
        id: activation
        uses: game-ci/unity-request-activation-file@v2

      - name: Upload Unity activation request
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Activation
          path: ${{ steps.activation.outputs.filePath }}

  license-check:
    name: Check Unity licence
    runs-on: ubuntu-latest
    needs: unity-activation

    outputs:
      available: ${{ steps.check.outputs.available }}

    steps:
      - name: Check licence secrets
        id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [ -n "$UNITY_LICENSE" ] || [ -n "$UNITY_SERIAL" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Unity licence configuration found."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Unity licence secrets configured - skipping the APK build."
          fi

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: [verify, license-check]

    if: >
      needs.license-check.outputs.available == 'true' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        )
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ runner.os }}-

      - name: Build Android
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          targetPlatform: Android
          unityVersion: auto
          androidExportType: androidPackage
          buildMethod: Shadowbound.Editor.ProjectSetup.BuildAndroidFromCommandLine

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shadowbound-APK
          path: build/Android/*.apk
