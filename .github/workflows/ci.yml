name: CI

# Verification gates that need no game engine. The Unreal Engine Android build
# lives in its own workflow (.github/workflows/android.yml) because it has very
# different resource requirements and reports its own outcome.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Verify (cores + Unreal layout)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Core purity (C# and C++)
        run: bash Tools/check-core-purity.sh

      - name: C# core tests (563)
        run: bash Tools/test-core.sh

      - name: C++ core tests (82)
        run: bash Tools/test-core-cpp.sh

      - name: Unreal project layout
        run: bash Tools/check-unreal-layout.sh
