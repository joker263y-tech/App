name: Android ARM64

# Exports a real Android ARM64 APK with Godot 4.5 - no Unreal Engine, no private
# container image. Godot and its export templates are free to download, so this
# runs on a stock GitHub runner.
#
# The build never fakes an APK. It ends with one of three honest outcomes:
#   * BUILD SUCCESS            exit 0 - an APK that passed validation is uploaded
#   * ENVIRONMENT LIMITATION   exit 3 - the toolchain was incomplete; no APK
#   * BUILD FAILURE            exit 1 - the toolchain was present but the build failed

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: '4.5-stable'
  ANDROID_BUILD_TOOLS: '35.0.1'
  ANDROID_PLATFORM: 'android-35'

jobs:
  export:
    name: Export APK (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (8 and 9 - the csproj targets net9.0)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # NOTE: android-actions/setup-android@v3 is deliberately NOT used: it
      # internally shells out to `sdkmanager tools`, a package that modern
      # command-line tools no longer publish, so it fails with
      # "Failed to find package 'tools'". GitHub's ubuntu runners already ship
      # a complete Android SDK, so we drive sdkmanager ourselves instead.
      - name: Setup Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error title=ENVIRONMENT LIMITATION::No Android SDK found at ${SDK_ROOT}"
            exit 3
          fi
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "Using Android SDK at ${SDK_ROOT}"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error title=ENVIRONMENT LIMITATION::sdkmanager not found under ${ANDROID_SDK_ROOT}/cmdline-tools"
            exit 3
          fi
          echo "Using sdkmanager: ${SDKMANAGER}"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "platforms;${ANDROID_PLATFORM}"

      - name: Install Godot 4.5 (.NET) editor
        run: |
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION%-*}-stable_mono_linux_x86_64.zip"
          unzip -q godot.zip
          BIN="$PWD/Godot_v${GODOT_VERSION%-*}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION%-*}-stable_mono_linux.x86_64"
          test -x "$BIN"
          echo "GODOT_BIN=$BIN" >> "$GITHUB_ENV"

      - name: Install Godot export templates
        run: |
          curl -sSL -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION%-*}-stable_mono_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          unzip -q templates.tpz -d /tmp/godot-templates
          mv /tmp/godot-templates/templates "$HOME/.local/share/godot/export_templates/4.5.stable.mono"
          ls "$HOME/.local/share/godot/export_templates/4.5.stable.mono" | head

      - name: Export Android ARM64 APK
        id: export
        run: |
          set +e
          bash Tools/build-android.sh "$PWD/build/android/shadowbound.apk"
          code=$?
          set -e
          echo "$code" > android-exit-code.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload APK
        if: steps.export.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: shadowbound-android-arm64
          path: build/android/shadowbound.apk

      - name: Classify outcome
        run: |
          code="$(cat android-exit-code.txt)"
          case "$code" in
            0)
              echo "Android export: BUILD SUCCESS (APK validated and uploaded)."
              ;;
            3)
              echo "::warning title=ENVIRONMENT LIMITATION::The Android toolchain was incomplete; no APK was produced. See the export step for which prerequisite was missing."
              ;;
            *)
              echo "::error title=BUILD FAILURE::The export ran but failed (exit $code). See the export step output."
              exit 1
              ;;
          esac
