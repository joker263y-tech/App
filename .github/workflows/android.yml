name: Shadowbound — Unreal Android

# =============================================================================
# Packages the game for Android ARM64 through Unreal Automation Tool
# (RunUAT BuildCookRun) inside an Unreal Engine container image.
#
# This workflow reports exactly one of three outcomes, in the job summary and
# through its exit status:
#
#   BUILD SUCCESS            an APK was produced AND validated (arm64-v8a libs,
#                            manifest present, plausible size).
#   BUILD FAILURE            an engine was present but compiling/cooking/
#                            packaging failed.
#   ENVIRONMENT LIMITATION   the runner cannot host the build at all. The
#                            summary lists every unmet prerequisite.
#
# It never creates a placeholder APK and never reports success without one.
#
# Prerequisites for a real build, and how they are checked:
#   1. Access to an Unreal Engine container image. Epic's official image
#      ghcr.io/epicgames/unreal-engine is PRIVATE: it needs a GitHub account
#      linked to an Epic account plus a token with read:packages (secret
#      GHCR_TOKEN). Checked by the login/pull steps.
#   2. Enough disk. The image is ~38 GB unpacked; plus Android SDK/NDK/JDK
#      (~10 GB) and cook/build intermediates (~20-40 GB). GitHub documents
#      14 GB SSD for standard runners, but a real run reports its own free
#      space - do not trust the datasheet over the measurement.
#   3. Enough RAM/CPU/time. Standard runners are 4 vCPU / 16 GB with a 6-hour
#      job limit; UE Android cooking is CPU-heavy.
#
# actions/cache is capped at 10 GB per repository, so it cannot cache the
# engine image: caching is not a way around requirement 2.
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      runner:
        description: >-
          Runner label. 'ubuntu-latest' measures the free runner; use a larger
          runner (e.g. ubuntu-8core) for a real build.
        required: false
        default: ubuntu-latest
      engine_image:
        description: 'Unreal Engine container image reference'
        required: false
        default: ghcr.io/epicgames/unreal-engine:dev-5.8
  push:
    branches: [main]
    paths:
      - '.github/workflows/android.yml'
      - 'Shadowbound.uproject'
      - 'Config/**'
      - 'Source/**'
      - 'Tools/build-android.sh'

concurrency:
  group: unreal-android-${{ github.ref }}
  cancel-in-progress: true

env:
  # Estimated free disk to complete image pull + Android toolchain + cook/build
  # intermediates. An estimate, stated so the summary can show the shortfall.
  REQ_DISK_GB: '90'
  REQ_RAM_GB: '16'
  REQ_CPU: '4'

jobs:
  preflight:
    name: Environment preflight
    runs-on: ubuntu-latest
    outputs:
      feasible: ${{ steps.measure.outputs.feasible }}
    steps:
      - name: Measure the runner against UE 5.8 Android requirements
        id: measure
        run: |
          set -euo pipefail

          # Best-effort reclaim, so the numbers are the best this runner can do
          # rather than the pre-installed baseline.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true

          echo "===== raw evidence ====="
          df -h / | sed 's/^/df: /'
          free -h | sed 's/^/mem: /'
          echo "nproc: $(nproc)"
          echo "========================"

          DISK=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          MEM=$(awk '/MemTotal/{printf "%d", $2/1024/1024}' /proc/meminfo)
          CPU=$(nproc)

          feasible=true
          [ "$DISK" -ge "$REQ_DISK_GB" ] || feasible=false
          [ "$MEM"  -ge "$REQ_RAM_GB"  ] || feasible=false
          [ "$CPU"  -ge "$REQ_CPU"     ] || feasible=false

          echo "free_disk_gb=$DISK" >> "$GITHUB_OUTPUT"
          echo "ram_gb=$MEM"        >> "$GITHUB_OUTPUT"
          echo "cpu=$CPU"           >> "$GITHUB_OUTPUT"
          echo "feasible=$feasible" >> "$GITHUB_OUTPUT"

          {
            echo "## Unreal Engine 5.8 — Android environment preflight"
            echo ""
            echo "| Resource | This runner (measured) | Estimated requirement |"
            echo "| --- | --- | --- |"
            echo "| Free disk | ${DISK} GB | ${REQ_DISK_GB} GB |"
            echo "| RAM | ${MEM} GB | ${REQ_RAM_GB} GB |"
            echo "| CPU | ${CPU} | ${REQ_CPU} |"
            echo ""
            echo "Requirement estimate: ~38 GB engine image + ~10 GB Android SDK/NDK/JDK"
            echo "+ ~20-40 GB cook/build intermediates."
            echo ""
            if [ "$feasible" = "true" ]; then
              echo "**Verdict: resource requirements met.** (Image entitlement is checked in the package job.)"
            else
              echo "**Verdict: ENVIRONMENT LIMITATION — resource shortfall on this runner.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  package:
    name: Package Android ARM64 (RunUAT BuildCookRun)
    needs: preflight
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 350
    env:
      ENGINE_IMAGE: ${{ github.event.inputs.engine_image || 'ghcr.io/epicgames/unreal-engine:dev-5.8' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Measure resources
        id: res
        run: |
          set -euo pipefail
          # Reclaim first, so the build gets the best disk this runner can offer.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          echo "===== raw evidence ====="
          df -h / | sed 's/^/df: /'
          free -h | sed 's/^/mem: /'
          echo "nproc: $(nproc)"
          echo "========================"
          DISK=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "free_disk_gb=$DISK" >> "$GITHUB_OUTPUT"
          if [ "$DISK" -ge "$REQ_DISK_GB" ]; then
            echo "disk_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "disk_ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Only ${DISK} GB free; ~${REQ_DISK_GB} GB estimated for a full UE Android package."
          fi

      # Always tested, independent of disk: entitlement to Epic's private image
      # is a separate fact and must not be inferred from a skipped step.
      - name: Log in to GitHub Container Registry
        id: ghcr
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GHCR_TOKEN:-}" ]; then
            echo "ghcr=missing" >> "$GITHUB_OUTPUT"
            echo "::warning::No GHCR_TOKEN. Epic's image is private and needs a token with read:packages from an Epic-linked GitHub account."
            exit 0
          fi
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "ghcr=ok" >> "$GITHUB_OUTPUT"

      - name: Pull the Unreal Engine image
        id: pull
        if: steps.res.outputs.disk_ok == 'true' && steps.ghcr.outputs.ghcr == 'ok'
        run: |
          set -euo pipefail
          if docker pull "$ENGINE_IMAGE"; then
            echo "pulled=true" >> "$GITHUB_OUTPUT"
          else
            echo "pulled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Failed to pull $ENGINE_IMAGE."
          fi

      - name: Build, cook, package and validate the APK
        id: build
        if: steps.pull.outputs.pulled == 'true'
        run: |
          set +e
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/project" \
            -e UNREAL_ENGINE_PATH=/home/ue4/UnrealEngine \
            -e ANDROID_HOME -e ANDROID_SDK_ROOT -e NDKROOT -e NDK_ROOT -e JAVA_HOME \
            "$ENGINE_IMAGE" \
            bash -lc 'cd /project && bash Tools/build-android.sh /project/Build/Android'
          STATUS=$?
          set -e
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Classify the outcome
        id: verdict
        run: |
          set -euo pipefail

          VERDICT="ENVIRONMENT LIMITATION"
          REASONS=""
          add_reason() { REASONS="${REASONS}${REASONS:+; }$1"; }

          if [ "${{ steps.pull.outputs.pulled }}" = "true" ]; then
            STATUS="${{ steps.build.outputs.status }}"
            if [ "$STATUS" = "0" ]; then
              VERDICT="BUILD SUCCESS"
              add_reason "RunUAT BuildCookRun produced a validated ARM64 APK."
            elif [ "$STATUS" = "3" ]; then
              add_reason "Engine present, Android toolchain incomplete inside the image."
            else
              VERDICT="BUILD FAILURE"
              add_reason "RunUAT BuildCookRun failed (status ${STATUS}); see the log above."
            fi
          else
            if [ "${{ steps.res.outputs.disk_ok }}" != "true" ]; then
              add_reason "free disk ${{ steps.res.outputs.free_disk_gb }} GB is below the ~${REQ_DISK_GB} GB estimated for a full UE Android package"
            fi
            if [ "${{ steps.ghcr.outputs.ghcr }}" != "ok" ]; then
              add_reason "Epic's official image is private and no usable GHCR_TOKEN (read:packages, Epic-linked account) was supplied"
            elif [ "${{ steps.pull.outputs.pulled }}" = "false" ]; then
              add_reason "the engine image could not be pulled onto this runner"
            fi
            [ -n "$REASONS" ] || add_reason "the build did not reach a packaging step"
          fi

          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
          {
            echo "## Unreal Android — ${VERDICT}"
            echo ""
            echo "**Reasons:** ${REASONS}"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Engine image | \`$ENGINE_IMAGE\` |"
            echo "| Runner | \`${{ github.event.inputs.runner || 'ubuntu-latest' }}\` |"
            echo "| Free disk at start | ${{ steps.res.outputs.free_disk_gb }} GB |"
            echo "| Outcome | **${VERDICT}** |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$VERDICT" = "BUILD FAILURE" ]; then
            echo "::error::$VERDICT — $REASONS"
            exit 1
          fi
          if [ "$VERDICT" = "ENVIRONMENT LIMITATION" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::$VERDICT — $REASONS"
            exit 1
          fi
          echo "::notice::$VERDICT — $REASONS"

      - name: Upload APK (only if one was produced)
        if: steps.pull.outputs.pulled == 'true' && steps.build.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: Shadowbound-Android-ARM64-APK
          path: Build/Android/**/*.apk
          if-no-files-found: error
